<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Women's Success Map | English Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      --bg: #fffafc;
      --panel: #ffffff;
      --text: #2a2431;
      --muted: #6f6578;
      --accent: #c05a93;
      --accent-soft: #f9e8f2;
      --border: #f0d8e7;
      --shadow: 0 12px 30px rgba(111, 66, 101, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #fff1f8, #fffafc 35%, #ffffff 100%);
      min-height: 100vh;
    }

    .page {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 1rem;
      min-height: 100vh;
      padding: 1rem;
    }

    .map-card,
    .info-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .map-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, #fff, #fff8fc);
    }

    .map-header h1 {
      margin: 0;
      font-size: clamp(1.15rem, 2vw, 1.6rem);
      font-family: 'Playfair Display', serif;
      letter-spacing: 0.2px;
    }

    .map-header p {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    #map {
      height: calc(100vh - 120px);
      min-height: 400px;
      width: 100%;
    }

    .info-panel {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .placeholder {
      margin: auto;
      text-align: center;
      color: var(--muted);
      max-width: 260px;
      line-height: 1.6;
    }

    .country {
      margin: 0;
      color: var(--accent);
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .name {
      margin: 0.25rem 0 0;
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 2.4vw, 2rem);
    }

    .story {
      margin: 0;
      color: var(--text);
      line-height: 1.75;
      font-size: 0.98rem;
    }

    .quote {
      margin: 0;
      border-left: 3px solid var(--accent);
      padding: 0.65rem 0.9rem;
      background: var(--accent-soft);
      border-radius: 0 10px 10px 0;
      font-style: italic;
      color: #59364f;
      line-height: 1.6;
    }

    .vocab h3 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
    }

    .vocab ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 0.5rem;
    }

    .vocab li {
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .vocab strong {
      color: var(--accent);
    }

    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .popup-title {
      margin: 0;
      color: var(--accent);
      font-weight: 700;
      font-size: 1rem;
    }

    .popup-sub {
      margin: 0.2rem 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    @media (max-width: 960px) {
      .page {
        grid-template-columns: 1fr;
      }

      #map {
        height: 60vh;
      }

      .info-panel {
        min-height: 280px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="map-card">
      <header class="map-header">
        <h1>Women's Success Map</h1>
        <p>Click a country marker to explore inspiring stories and build your English vocabulary.</p>
      </header>
      <div id="map" aria-label="Interactive world map"></div>
    </section>

    <aside class="info-panel" id="infoPanel">
      <div class="placeholder">
        <h2 class="name">Explore the map</h2>
        <p>Choose a marker to view a success story and a vocabulary boost section.</p>
      </div>
    </aside>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const womenData = [
      {
        country: 'Ukraine',
        name: 'Lesya Ukrainka',
        coords: [50.4501, 30.5234],
        story:
          'Lesya Ukrainka became one of the most important voices in Ukrainian literature despite living with a serious illness for many years. She wrote poetry and dramas that inspired people to stay strong and protect their identity. Her work still teaches courage and resilience to new generations.',
        quote: '“Who told you I am weak, that I obey my fate?”',
        vocabulary: [
          ['voice', 'a strong way to express ideas and feelings'],
          ['identity', 'the qualities that make people or nations unique'],
          ['resilience', 'the ability to recover from difficulties'],
          ['inspire', 'to motivate someone to take positive action'],
          ['generation', 'all people born around the same period']
        ]
      },
      {
        country: 'United States',
        name: 'Katherine Johnson',
        coords: [38.9072, -77.0369],
        story:
          'Katherine Johnson was a mathematician whose calculations helped NASA send astronauts safely into space. She worked in a period when racial and gender discrimination were very strong, but her talent could not be ignored. Her precision and determination changed science history.',
        quote: '“Like what you do, and then you will do your best.”',
        vocabulary: [
          ['calculation', 'the process of using numbers to find an answer'],
          ['astronaut', 'a person trained to travel in space'],
          ['discrimination', 'unfair treatment based on identity'],
          ['precision', 'great accuracy and exactness'],
          ['determination', 'the decision to continue despite difficulty']
        ]
      },
      {
        country: 'United Kingdom',
        name: 'Ada Lovelace',
        coords: [51.5072, -0.1276],
        story:
          'Ada Lovelace wrote the first algorithm intended for a machine in the 19th century. While many people saw early computers as simple calculators, she imagined they could create music and art. Her visionary thinking made her a pioneer of computer science.',
        quote: '“That brain of mine is something more than merely mortal.”',
        vocabulary: [
          ['algorithm', 'a step-by-step set of instructions'],
          ['intended', 'planned or designed for a purpose'],
          ['visionary', 'able to imagine the future creatively'],
          ['pioneer', 'a person who is among the first in a field'],
          ['merely', 'only; no more than']
        ]
      },
      {
        country: 'France',
        name: 'Marie Curie',
        coords: [48.8566, 2.3522],
        story:
          'Marie Curie was the first woman to win a Nobel Prize and the first person to win Nobel Prizes in two different sciences. Her research on radioactivity opened new paths in medicine and physics. She proved that deep curiosity and hard work can transform the world.',
        quote: '“Nothing in life is to be feared, it is only to be understood.”',
        vocabulary: [
          ['research', 'careful study to discover facts'],
          ['radioactivity', 'energy released from unstable atoms'],
          ['curiosity', 'a strong desire to know or learn'],
          ['transform', 'to change completely into something better'],
          ['understood', 'known clearly through learning or thought']
        ]
      },
      {
        country: 'Kenya',
        name: 'Wangari Maathai',
        coords: [-1.2864, 36.8172],
        story:
          'Wangari Maathai founded the Green Belt Movement, helping communities plant millions of trees across Kenya. She linked environmental protection with women’s rights and social justice. Her leadership showed that local action can create global impact.',
        quote: '“It is the little things citizens do. That’s what will make the difference.”',
        vocabulary: [
          ['founded', 'started an organization or movement'],
          ['community', 'a group of people living or working together'],
          ['environmental', 'related to nature and the planet'],
          ['justice', 'fair treatment and equal rights'],
          ['impact', 'a strong effect on someone or something']
        ]
      },
      {
        country: 'Pakistan',
        name: 'Malala Yousafzai',
        coords: [33.6844, 73.0479],
        story:
          'Malala Yousafzai became a global advocate for girls’ education after surviving an attack at a young age. She continued speaking publicly and co-founded the Malala Fund to support learning opportunities worldwide. Her bravery turned personal pain into powerful change.',
        quote: '“One child, one teacher, one book, one pen can change the world.”',
        vocabulary: [
          ['advocate', 'someone who publicly supports a cause'],
          ['survive', 'to continue living after a dangerous event'],
          ['co-found', 'to create something together with others'],
          ['opportunity', 'a good chance for progress'],
          ['bravery', 'courage in difficult or dangerous situations']
        ]
      }
    ];

    const map = L.map('map', {
      worldCopyJump: true,
      zoomControl: true
    }).setView([20, 10], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    const infoPanel = document.getElementById('infoPanel');

    function renderPanel(entry) {
      const vocabHtml = entry.vocabulary
        .map(([word, meaning]) => `<li><strong>${word}</strong>: ${meaning}</li>`)
        .join('');

      infoPanel.innerHTML = `
        <p class="country">${entry.country}</p>
        <h2 class="name">${entry.name}</h2>
        <p class="story">${entry.story}</p>
        <p class="quote">${entry.quote}</p>
        <section class="vocab">
          <h3>Vocabulary Boost</h3>
          <ul>${vocabHtml}</ul>
        </section>
      `;
    }

    womenData.forEach((entry) => {
      const marker = L.circleMarker(entry.coords, {
        radius: 9,
        fillColor: '#c05a93',
        color: '#ffffff',
        weight: 2,
        opacity: 1,
        fillOpacity: 0.9
      }).addTo(map);

      marker.bindPopup(`
        <p class="popup-title">${entry.name}</p>
        <p class="popup-sub">${entry.country}</p>
      `);

      marker.on('click', () => {
        renderPanel(entry);
      });
    });
  </script>
</body>
</html>
